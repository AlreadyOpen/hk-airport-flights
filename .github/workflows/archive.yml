# Daily archive (kaggle_archive.py): each complete Hong Kong day to its own Kaggle dataset; days older than 7 leave the bucket
# only once Kaggle lists them. 16:40 UTC = 00:40 HKT, after the day's last snapshot. Commits status/last-run.json: GitHub turns
# schedules off after 60 days with no commits.
name: archive
on:
  schedule:
    - cron: '40 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: archive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: set -o pipefail; mkdir -p status && python kaggle_archive.py | tee status/last-run.json   # git keeps no empty folder
      - name: keep-alive commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/last-run.json
          git commit -m "archive $(date -u +%F)" || exit 0
          git pull --rebase -q && git push   # main may have moved during the run
